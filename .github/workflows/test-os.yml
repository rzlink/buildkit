name: test-os

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      arm64_only:
        description: 'Run only ARM64 tests (skip AMD64/FreeBSD)'
        required: false
        type: boolean
        default: false
      arm64_test_filter:
        description: 'Regex filter for ARM64 test names (e.g. TestFoo|TestBar). Only matching tests run.'
        required: false
        type: string
        default: ''
  push:
    branches:
      - 'master'
      - 'v[0-9]+.[0-9]+'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'frontend/dockerfile/docs/**'

env:
  GO_VERSION: "1.26"
  SETUP_BUILDX_VERSION: "edge"
  SETUP_BUILDKIT_IMAGE: "moby/buildkit:latest"
  DESTDIR: "./bin"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows/amd64
          - windows/arm64
          - freebsd/amd64
    steps:
      -
        name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: ${{ env.SETUP_BUILDX_VERSION }}
          driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
          buildkitd-flags: --debug
      -
        name: Build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          targets: binaries-for-test
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=binaries-for-test-${{ env.PLATFORM_PAIR }}
            *.cache-to=type=gha,scope=binaries-for-test-${{ env.PLATFORM_PAIR }},repository=${{ github.repository }},ghtoken=${{ secrets.GITHUB_TOKEN }}
      -
        name: List artifacts
        run: |
          tree -nh ${{ env.DESTDIR }}
      -
        name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildkit-${{ env.PLATFORM_PAIR }}
          path: ${{ env.DESTDIR }}/*
          if-no-files-found: error
          retention-days: 1

  test-windows-amd64:
    if: ${{ !inputs.arm64_only }}
    runs-on: ${{ matrix.os }}
    needs:
      - build
    env:
      TESTFLAGS: "-v --timeout=60m"
      GOTESTSUM_FORMAT: "standard-verbose"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        worker:
          - containerd
        pkg:
          - ./client#1-4
          - ./client#2-4
          - ./client#3-4
          - ./client#4-4
          - ./cmd/buildctl
          - ./worker/containerd
          - ./solver
          - ./frontend
          - ./frontend/dockerfile#1-12
          - ./frontend/dockerfile#2-12
          - ./frontend/dockerfile#3-12
          - ./frontend/dockerfile#4-12
          - ./frontend/dockerfile#5-12
          - ./frontend/dockerfile#6-12
          - ./frontend/dockerfile#7-12
          - ./frontend/dockerfile#8-12
          - ./frontend/dockerfile#9-12
          - ./frontend/dockerfile#10-12
          - ./frontend/dockerfile#11-12
          - ./frontend/dockerfile#12-12
        include:
          - os: windows-2022
            worker: containerd
            pkg: ./...
            skip-integration-tests: 1
    steps:
      -
        name: Prepare
        run: |
          TESTPKG=$(echo "${{ matrix.pkg }}" | awk '-F#' '{print $1}')
          echo "TESTPKG=$TESTPKG" >> $GITHUB_ENV
          echo "TEST_REPORT_NAME=${{ github.job }}-$(echo "${{ matrix.pkg }}-${{ matrix.skip-integration-tests }}-${{ matrix.worker }}" | tr -dc '[:alnum:]-\n\r' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          testFlags="${{ env.TESTFLAGS }}"
          testSlice=$(echo "${{ matrix.pkg }}" | awk '-F#' '{print $2}')
          testSliceOffset=""
          if [ -n "$testSlice" ]; then
            testSliceOffset="slice=$testSlice/"
          fi
          if [ -n "${{ matrix.worker }}" ]; then
            testFlags="${testFlags} --run=TestIntegration/$testSliceOffset.*/worker=${{ matrix.worker }}"
          fi
          echo "TESTFLAGS=${testFlags}" >> $GITHUB_ENV
        shell: bash
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      -
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false
      -
        name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buildkit-windows-amd64
          path: ${{ github.workspace }}\bin
      -
        name: Add bin folder to Path
        run: |
          echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      -
        name: Test
        env:
          TMPDIR: ${{ runner.temp }}
          SKIP_INTEGRATION_TESTS: ${{ matrix.skip-integration-tests }}
        run: |
          mkdir -p ./bin/testreports
          gotestsum \
            --jsonfile="./bin/testreports/go-test-report-${{ env.TEST_REPORT_NAME }}.json" \
            --junitfile="./bin/testreports/junit-report-${{ env.TEST_REPORT_NAME }}.xml" \
            --packages="${{ env.TESTPKG }}" \
            -- \
              "-mod=vendor" \
              "-coverprofile" "./bin/testreports/coverage-${{ env.TEST_REPORT_NAME }}.txt" \
              "-covermode" "atomic" ${{ env.TESTFLAGS }}
        shell: bash
      -
        name: Send to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./bin/testreports
          env_vars: RUNNER_OS
          flags: unit
          disable_file_fixes: true
          token: ${{ secrets.CODECOV_TOKEN }}  # used to upload coverage reports: https://github.com/moby/buildkit/pull/4660#issue-2142122533
      -
        name: Generate annotations
        if: always()
        uses: crazy-max/.github/.github/actions/gotest-annotations@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
        with:
          directory: ./bin/testreports
      -
        name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}-${{ env.TEST_REPORT_NAME }}
          path: ./bin/testreports
          retention-days: 1

  test-windows-arm64:
    runs-on: [self-hosted, windows-arm64-selfhosted]
    timeout-minutes: 120
    needs:
      - build
    env:
      TESTFLAGS: "-v --timeout=60m"
      GOTESTSUM_FORMAT: "standard-verbose"
    strategy:
      fail-fast: false
      matrix:
        worker:
          - containerd
        pkg:
          - ./client#1-4
          - ./client#2-4
          - ./client#3-4
          - ./client#4-4
          - ./cmd/buildctl
          - ./worker/containerd
          - ./solver
          - ./frontend
          - ./frontend/dockerfile#1-12
          - ./frontend/dockerfile#2-12
          - ./frontend/dockerfile#3-12
          - ./frontend/dockerfile#4-12
          - ./frontend/dockerfile#5-12
          - ./frontend/dockerfile#6-12
          - ./frontend/dockerfile#7-12
          - ./frontend/dockerfile#8-12
          - ./frontend/dockerfile#9-12
          - ./frontend/dockerfile#10-12
          - ./frontend/dockerfile#11-12
          - ./frontend/dockerfile#12-12
        include:
          - worker: containerd
            pkg: ./...
            skip-integration-tests: 1
    steps:
      -
        name: Prepare
        run: |
          TESTPKG=$(echo "${{ matrix.pkg }}" | awk '-F#' '{print $1}')
          echo "TESTPKG=$TESTPKG" >> $GITHUB_ENV
          echo "TEST_REPORT_NAME=${{ github.job }}-$(echo "${{ matrix.pkg }}-${{ matrix.skip-integration-tests }}-${{ matrix.worker }}" | tr -dc '[:alnum:]-\n\r' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          testFlags="${{ env.TESTFLAGS }}"
          testSlice=$(echo "${{ matrix.pkg }}" | awk '-F#' '{print $2}')
          testSliceOffset=""
          if [ -n "$testSlice" ]; then
            testSliceOffset="slice=$testSlice/"
          fi
          if [ -n "${{ matrix.worker }}" ]; then
            testFilter="${{ inputs.arm64_test_filter }}"
            if [ -n "$testFilter" ]; then
              testFlags="${testFlags} '--run=TestIntegration/${testSliceOffset}(${testFilter})/worker=${{ matrix.worker }}'"
            else
              testFlags="${testFlags} --run=TestIntegration/$testSliceOffset.*/worker=${{ matrix.worker }}"
            fi
          fi
          echo "TESTFLAGS=${testFlags}" >> $GITHUB_ENV
        shell: bash
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false
      -
        name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: buildkit-windows-arm64
          path: ${{ github.workspace }}\bin
      -
        name: Add bin folder to Path
        run: |
          echo "${{ github.workspace }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      -
        name: Test
        env:
          TMPDIR: ${{ runner.temp }}
          SKIP_INTEGRATION_TESTS: ${{ matrix.skip-integration-tests }}
        run: |
          mkdir -p ./bin/testreports
          gotestsum \
            --jsonfile="./bin/testreports/go-test-report-${{ env.TEST_REPORT_NAME }}.json" \
            --junitfile="./bin/testreports/junit-report-${{ env.TEST_REPORT_NAME }}.xml" \
            --packages="${{ env.TESTPKG }}" \
            -- \
              "-mod=vendor" \
              "-coverprofile" "./bin/testreports/coverage-${{ env.TEST_REPORT_NAME }}.txt" \
              "-covermode" "atomic" ${{ env.TESTFLAGS }}
        shell: bash
      -
        name: Test summary
        if: always()
        run: |
          python3 -c "
          import json, os, sys
          report = os.path.join('bin', 'testreports', 'go-test-report-${{ env.TEST_REPORT_NAME }}.json')
          if not os.path.exists(report):
              print('No test report found')
              sys.exit(0)
          tests = {}
          with open(report, encoding='utf-8') as f:
              for line in f:
                  e = json.loads(line)
                  if e.get('Test') and e.get('Action') in ('pass','fail','skip') and e.get('Elapsed') is not None:
                      tests[e['Test']] = {'action': e['Action'], 'elapsed': e['Elapsed']}
          if not tests:
              sys.exit(0)
          out = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if not out:
              sys.exit(0)
          with open(out, 'a', encoding='utf-8') as f:
              f.write('### Test Results\n\n')
              passed = sum(1 for t in tests.values() if t['action']=='pass')
              failed = sum(1 for t in tests.values() if t['action']=='fail')
              skipped = sum(1 for t in tests.values() if t['action']=='skip')
              f.write(f'✅ {passed} passed, ❌ {failed} failed, ⏭️ {skipped} skipped\n\n')
              slow = [(n,t) for n,t in tests.items() if t['action'] in ('pass','fail') and t['elapsed'] >= 5]
              def parse_name(name):
                  parts = name.split('/')
                  tn = next((p for p in parts if '=' not in p and p != 'TestIntegration'), name)
                  kvs = [p for p in parts if '=' in p and not p.startswith('slice=')]
                  return tn, ', '.join(kvs) if kvs else ''
              if slow:
                  f.write('<details><summary>Tests ≥ 5s (sorted by duration)</summary>\n\n')
                  f.write('| Status | Duration | Test | Instance |\n|--------|----------|------|----------|\n')
                  for name, t in sorted(slow, key=lambda x: -x[1]['elapsed']):
                      icon = '✅' if t['action']=='pass' else '❌'
                      m, s = divmod(t['elapsed'], 60)
                      dur = f'{int(m)}m{s:.0f}s' if m else f\"{t['elapsed']:.1f}s\"
                      tn, inst = parse_name(name)
                      f.write(f'| {icon} | {dur} | {tn} | {inst} |\n')
                  f.write('\n</details>\n')
              if failed:
                  f.write('\n**Failed tests:**\n')
                  for name, t in tests.items():
                      if t['action']=='fail':
                          m, s = divmod(t['elapsed'], 60)
                          dur = f'{int(m)}m{s:.0f}s' if m else f\"{t['elapsed']:.1f}s\"
                          tn, inst = parse_name(name)
                          inst_str = f' ({inst})' if inst else ''
                          f.write(f'- ❌ **{tn}**{inst_str} ({dur})\n')
          "
        shell: bash
      -
        name: Send to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          directory: ./bin/testreports
          env_vars: RUNNER_OS
          flags: unit
          disable_file_fixes: true
          token: ${{ secrets.CODECOV_TOKEN }}
      -
        name: Generate annotations
        if: always()
        uses: crazy-max/.github/.github/actions/gotest-annotations@fa6141aedf23596fb8bdcceab9cce8dadaa31bd9
        with:
          directory: ./bin/testreports
      -
        name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows-arm64-${{ env.TEST_REPORT_NAME }}
          path: ./bin/testreports
          retention-days: 1
      -
        name: Dump context
        if: failure()
        uses: crazy-max/ghaction-dump-context@v2

  test-freebsd-amd64:
    if: ${{ !inputs.arm64_only }}
    runs-on: ubuntu-24.04
    needs:
      - build
    env:
      GOOS: freebsd
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buildkit-freebsd-amd64
          path: ${{ env.DESTDIR }}
      -
        name: Set up FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.3"
          prepare: |
            set -eux
            freebsd-version -kru
            kldstat -m nullfs >/dev/null 2>&1 || kldload nullfs
            pkg bootstrap -y
            # TODO: Remove once latest packages include a fix for the runj exit notification regression.
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'EOF'
            FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly" }
            EOF
            pkg install -y git runj
      -
        name: Start daemons
        shell: freebsd {0}
        run: |
          set -eux
          mkdir -p /var/run/buildkit
          install -m 755 bin/buildkitd /usr/local/bin/buildkitd
          install -m 755 bin/buildctl /usr/local/bin/buildctl
          install -m 755 bin/containerd /bin/containerd
          buildkitd --version
          containerd --version
          daemon -f -o /var/log/containerd.log containerd --log-level debug
          attempt=0
          until [ -S /var/run/containerd/containerd.sock ]; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              echo "Timed out waiting for containerd" >&2
              exit 1
            fi
            sleep 1
          done
          daemon -f -o /var/log/buildkitd.log /usr/local/bin/buildkitd --debug --debugaddr 127.0.0.1:6060
          attempt=0
          until buildctl debug workers; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              echo "Timed out waiting for BuildKit" >&2
              exit 1
            fi
            sleep 1
          done
      -
        name: Smoke test
        timeout-minutes: 1
        run: |
          freebsd /dev/stdin <<'EOF'
          set -eux
          mkdir -p .tmp/freebsd-smoke
          cd .tmp/freebsd-smoke
          cat > Dockerfile <<'DOCKERFILE'
          FROM dougrabson/freebsd-minimal:13
          RUN echo "Hello, buildkit!"
          DOCKERFILE
          buildctl build --frontend dockerfile.v0 --local context=. --local dockerfile=.
          EOF
      -
        name: BuildKit logs
        if: always()
        shell: freebsd {0}
        run: |
          cat /var/log/buildkitd.log
      -
        name: Containerd logs
        if: always()
        shell: freebsd {0}
        run: |
          cat /var/log/containerd.log

  sandbox-build:
    if: ${{ github.repository == 'moby/buildkit' && !inputs.arm64_only }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: ${{ env.SETUP_BUILDX_VERSION }}
          driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
          buildkitd-flags: --debug
      -
        name: Build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          targets: integration-tests-base
          set: |
            *.platform=${{ matrix.platform }}
